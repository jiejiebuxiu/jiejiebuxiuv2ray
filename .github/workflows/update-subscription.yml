name: Update tested subscriptions
on:
  schedule:
    - cron: '23 */4 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'auto_sub/**'
      - '.github/workflows/update-subscription.yml'
permissions:
  contents: write
concurrency:
  group: tested-subscription
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install verified Mihomo
        run: python auto_sub/download_core.py
      - name: Verify subscription processing
        run: python -m unittest discover -s auto_sub -p 'test_*.py' -v
      - name: Collect and test actual HTTPS proxy traffic
        run: python auto_sub/update.py
      - name: Publish successful subscriptions
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add output/
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Update HTTPS-tested subscriptions'
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Summarize results
        if: success()
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          r = json.loads(Path('output/report.json').read_text())
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
              f.write(f"Published {r['published']} nodes. Tested at {r['tested_at_utc']}.\n\n")
              f.write('Runner measurements do not guarantee reachability or speed on your local network.\n')
          PY
